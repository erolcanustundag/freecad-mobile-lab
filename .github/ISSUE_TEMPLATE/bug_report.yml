name: Android bug report
description: Report a crash, import failure or incorrect model operation.
body:
  - type: input
    id: version
    attributes:
      label: APK version
      placeholder: 1.0-rc7
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Crash report
      description: Use the recovery screen to copy or export the local report. Remove personal file names before posting.
  - type: textarea
    id: files
    attributes:
      label: Sample model
      description: Attach a small model only if you are comfortable sharing it publicly.
