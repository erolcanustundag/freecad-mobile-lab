name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m compileall -q scripts tests app/src/main/assets/core
      - name: Check runtime packaging regressions
        run: python3 tests/test_runtime_packaging.py
      - name: Check language resources
        run: |
          python3 scripts/localization_catalog.py --check
          python3 tests/test_localization.py
      - name: Check release metadata
        run: python3 scripts/check_public_metadata.py
