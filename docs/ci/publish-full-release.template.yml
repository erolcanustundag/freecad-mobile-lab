name: Publish full native release 1.23
on:
  push:
    branches: [release-upload-1-23]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public assets and publish full release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .release-transport/publish.py
